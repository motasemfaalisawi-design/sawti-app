<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Soundwave circles -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#3b82f6" stroke-width="6" stroke-opacity="0.25"/>
  <circle cx="256" cy="230" r="105" fill="none" stroke="#60a5fa" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Microphone Icon -->
  <g filter="url(#glow)">
    <!-- Capsule -->
    <rect x="216" y="140" width="80" height="150" rx="40" fill="url(#primaryGrad)"/>
    
    <!-- U-Shape cradle -->
    <path d="M180 220 C180 300, 332 300, 332 220" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Stand stem -->
    <path d="M256 295 L256 360" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Base -->
    <path d="M200 360 L312 360" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>

    <!-- Sound waves beside mic -->
    <path d="M140 190 C125 215, 125 245, 140 270" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <path d="M372 190 C387 215, 387 245, 372 270" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
